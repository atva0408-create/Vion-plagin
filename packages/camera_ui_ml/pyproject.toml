[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vion-ml"
version = "1.3.0"
description = "The ML inference shared by the detection plugins of VION (ONNX, OpenVINO, CoreML, NCNN, Coral)"
keywords = ["vion", "python", "ml", "inference", "detection"]
readme = "README.md"
license-files = ["LICENSE.md"]
authors = [{ name = "seydx", email = "hi@seydx.dev" }]
maintainers = [{ name = "VION", email = "hi@vionvision.tech" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# camera_ui_sdk is not a dependency: the server gives its plugins their own (vion-sdk in its Python environment, first in
# a plugin's PYTHONPATH); named here, pip fetched camera-ui-sdk from the author's project on pypi.org at every client
dependencies = ["typing_extensions>=4.16.0", "numpy>=2.5.3", "pillow>=13.0.0", "aiohttp>=3.14.3"]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]
clip = ["transformers>=5.17.0"]

[project.urls]
Homepage = "https://vionvision.tech"
Repository = "https://github.com/atva0408-create/Vion-plagin/tree/main/packages/camera_ui_ml"
"Bug Tracker" = "https://github.com/atva0408-create/Vion-plagin/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["camera_ui_ml*"]

[tool.setuptools.package-data]
camera_ui_ml = ["py.typed"]